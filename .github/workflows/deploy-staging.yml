name: Deploy to Staging

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.force_deploy != 'true'
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
          run_install: true
          
      - name: Run tests
        run: |
          pnpm test -- --run
          pnpm check-types
          pnpm lint

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.force_deploy == 'true')
    
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          
      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.STAGING_SERVER_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to staging server
        run: |
          ssh ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} << 'EOF'
            set -e
            
            echo "🚀 Starting staging deployment..."
            
            # Navigate to deployment directory
            cd /home/chat-ai/deploy-staging || {
              echo "❌ Deployment directory not found. Creating..."
              mkdir -p /home/chat-ai/deploy-staging
              cd /home/chat-ai/deploy-staging
            }
            
            # Pull latest code
            echo "📥 Pulling latest code..."
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            else
              git clone https://github.com/${{ github.repository }}.git .
              git checkout ${{ github.ref_name }}
            fi
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            if ! command -v pnpm &> /dev/null; then
              npm install -g pnpm
            fi
            pnpm install --prod --frozen-lockfile
            
            # Run database migrations
            echo "🗄️ Running database migrations..."
            pnpm db:push || echo "⚠️ Database migration failed, continuing..."
            
            # Build application
            echo "🏗️ Building application..."
            pnpm build:local
            
            # Restart application
            echo "🔄 Restarting application..."
            pkill -f "next start" || true
            sleep 2
            
            # Start application in background
            nohup pnpm start > app.log 2>&1 &
            sleep 5
            
            # Verify deployment
            echo "✅ Verifying deployment..."
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "🎉 Staging deployment successful!"
            else
              echo "❌ Deployment verification failed"
              tail -n 20 app.log
              exit 1
            fi
          EOF
          
      - name: Verify staging deployment
        run: |
          echo "🔍 Verifying staging deployment..."
          sleep 10
          
          # Check if staging domain is accessible
          if curl -f --connect-timeout 10 "http://${{ secrets.STAGING_DOMAIN }}" > /dev/null 2>&1; then
            echo "✅ Staging deployment verified: http://${{ secrets.STAGING_DOMAIN }}"
          else
            echo "⚠️ Staging domain not accessible, but server deployment may be successful"
            echo "💡 Check: http://${{ secrets.STAGING_SERVER_HOST }}:3000"
          fi
          
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment completed successfully"
            echo "🌐 Staging URL: http://${{ secrets.STAGING_DOMAIN }}"
          else
            echo "❌ Staging deployment failed"
            echo "📋 Check the logs above for details"
          fi
